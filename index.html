<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WASM C99 Demo</title>
    <style>
        html,
        body {
            background: #232323;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>Custom tempalloc Demo</h1>
    <p>Counting tokens: <span id="result">Loading...</span></p>

    <script>
        async function run() {
            const response = await fetch('./.build/umn.wasm');
            const bytes = await response.arrayBuffer();
            const { instance } = await WebAssembly.instantiate(bytes);
            const exports = instance.exports;

            // 1. Access Memory
            const memory = new Uint8Array(exports.memory.buffer);

            function prepare_string(str, data) {
                const encoder = new TextEncoder(), encoded = encoder.encode(str);
                const ptr = exports.tempalloc(encoded.length + 1);
                memory.set(encoded, ptr);
                memory[ptr + encoded.length] = 0;

                ptr.encoded_lenght = encoded.length;

                return ptr;
            }

            const jsString = "10|~0xa, food_for_taught", ptr = prepare_string(jsString);
            const count = exports.count_tokens(ptr, ptr.encoded_lenght);
            document.getElementById('result').textContent = `"${jsString}" contains ${count} tokens.`;

            let tptr = prepare_string(" ~(0xf << 1)")
            let rptr = exports.hex_encode(tptr);

            let strlen = (initial) => { let count = 0; while (memory[(initial + count)] != 0) count++; return count };
            const decoder = new TextDecoder();
            console.log(strlen(rptr))

            let s = decoder.decode(memory.slice(rptr, rptr + strlen(rptr)), {})

            console.log(s)

            exports.panic()
        }

        run().catch(console.error);
    </script>
</body>

</html>
